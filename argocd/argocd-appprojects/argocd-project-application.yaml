apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: application-project
  namespace: argocd
spec:
  description: Aplicações entregues pelo pipeline (helm-applications no Gitea)
  sourceRepos:
    - 'ssh://git@gitea.localhost.com/patrickmanzo/helm-applications.git'
  destinations:
    - namespace: dev
      server: 'https://kubernetes.default.svc'
    - namespace: stg
      server: 'https://kubernetes.default.svc'
    - namespace: prd
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
