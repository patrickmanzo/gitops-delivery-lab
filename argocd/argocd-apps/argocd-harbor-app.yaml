apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: harbor-project
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: "1.19.4"
      helm:
        releaseName: harbor
        valueFiles:
          - $values/values/harbor/harbor-values.yaml
    - repoURL: https://github.com/patrickmanzo/gitops-delivery-lab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/patrickmanzo/gitops-delivery-lab.git
      targetRevision: main
      path: secrets/harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
        - /spec/persistentVolumeClaimRetentionPolicy
