apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-managed-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd # Namespace for ArgoCD
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.10.5"
      helm:
        valueFiles:
          - $values/values/argocd/argocd-values.yaml
    - repoURL: https://github.com/patrickmanzo/gitops-delivery-lab.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "300s"
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # Server-Side Apply for better conflict resolution
      - PruneLast=true            # Prune resources after the sync operation
      - ApplyOutOfSyncOnly=true   # Only apply changes if the resource is out of sync
