apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: jenkins-project
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: "5.9.69"
      helm:
        releaseName: jenkins
        valueFiles:
          - $values/values/jenkins/jenkins-values.yaml
    - repoURL: https://github.com/patrickmanzo/gitops-delivery-lab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/patrickmanzo/gitops-delivery-lab.git
      targetRevision: main
      path: secrets/jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
