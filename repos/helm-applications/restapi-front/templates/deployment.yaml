apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restapi-front.fullname" . }}
  labels: {{- include "restapi-front.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "restapi-front.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "restapi-front.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # preStop (5s) + static-web-server shutdown
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: front
        image: {{ .Values.image.registry }}:{{ .Values.image.tag }}
        env:
        - name: ENVIRONMENT
          value: {{ .Values.environment | quote }}
        - name: APP_VERSION
          value: {{ .Values.image.tag | quote }}
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 1
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 2
        # wait for Traefik to drop the pod from endpoints before shutting down (no 5xx on rollout)
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /public/config.json
          subPath: config.json
      volumes:
      - name: config
        configMap:
          name: {{ include "restapi-front.fullname" . }}
