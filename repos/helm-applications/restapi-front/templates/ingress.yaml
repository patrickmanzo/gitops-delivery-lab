{{- if .Values.ingress.enabled }}
# /api -> API Service in the same namespace (no CORS)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "restapi-front.fullname" . }}-strip-api
  labels: {{- include "restapi-front.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "restapi-front.fullname" . }}-api
  labels: {{- include "restapi-front.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "restapi-front.fullname" . }}-strip-api@kubernetescrd
    # only API calls become spans
    traefik.ingress.kubernetes.io/router.observability.tracing: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: {{ .Values.api.service }}
            port:
              number: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "restapi-front.fullname" . }}
  labels: {{- include "restapi-front.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: {{ include "restapi-front.fullname" . }}
            port:
              name: http
{{- end }}
