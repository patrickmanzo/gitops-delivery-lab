apiVersion: v1
kind: Pod
metadata:
  name: {{ include "restapi-front.fullname" . }}-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: busybox:1.37
    command:
    - sh
    - -c
    - |
      set -e
      wget -qO- http://{{ include "restapi-front.fullname" . }}/ | grep -q '<div id="root">'
      wget -qO- http://{{ include "restapi-front.fullname" . }}/config.json | grep -q '"environment":"{{ .Values.environment }}"'
