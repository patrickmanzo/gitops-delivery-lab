{{- $path := printf "apps/%s/restapi-flask" .Release.Namespace }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: apps-{{ .Release.Namespace }}
          serviceAccountRef:
            name: {{ include "restapi-flask.fullname" . }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: restapi-flask-mongodb
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- range $user := list "root" "api" }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: restapi-flask-mongodb-{{ $user }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: restapi-flask-mongodb
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: {{ $path }}/mongodb-{{ $user }}
          property: password
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restapi-flask-mongodb-auth
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: restapi-flask-mongodb-auth
    template:
      data:
        mongodb-root-password: "{{ `{{ .root }}` }}"
        mongodb-passwords: "{{ `{{ .api }}` }}"
  data:
    - secretKey: root
      remoteRef:
        key: {{ $path }}/mongodb-root
        property: password
    - secretKey: api
      remoteRef:
        key: {{ $path }}/mongodb-api
        property: password
