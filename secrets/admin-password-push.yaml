# Writes the make seed once; afterwards the vault is the source (changes there propagate to the ExternalSecrets)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: platform-admin
  namespace: external-secrets
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao-platform
      kind: ClusterSecretStore
  selector:
    secret:
      name: platform-admin-seed
  data:
    - conversionStrategy: None
      match:
        secretKey: password
        remoteRef:
          remoteKey: platform/admin
          property: password
