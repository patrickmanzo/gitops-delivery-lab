apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-platform
    kind: ClusterSecretStore
  target:
    name: harbor-admin
    template:
      data:
        HARBOR_ADMIN_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/admin
        property: password
