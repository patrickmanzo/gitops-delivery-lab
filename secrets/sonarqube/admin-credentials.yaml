apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-admin
  namespace: sonarqube
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-platform
    kind: ClusterSecretStore
  target:
    name: sonarqube-admin
    template:
      data:
        password: "{{ .password }}"
        currentPassword: admin
        monitoringPasscode: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/admin
        property: password
