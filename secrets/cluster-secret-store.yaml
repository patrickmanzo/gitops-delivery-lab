# Platform only; apps use a SecretStore in their own namespace (per-environment isolation)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-platform
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-platform
spec:
  conditions:
    - namespaces: [external-secrets, jenkins, gitea, harbor, sonarqube, monitoring]
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef:
            name: eso-platform
            namespace: external-secrets
