apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-platform
    kind: ClusterSecretStore
  target:
    name: jenkins-admin
    template:
      data:
        jenkins-admin-user: admin
        jenkins-admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/admin
        property: password
