apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin
  namespace: gitea
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-platform
    kind: ClusterSecretStore
  target:
    name: gitea-admin
    template:
      data:
        username: gitea_admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/admin
        property: password
