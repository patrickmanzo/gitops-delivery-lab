# Release name MUST be argocd-self-managed-application (Makefile and self-managed Application).
fullnameOverride: argocd

global:
  domain: argocd.localhost.com

configs:
  cm:
    admin.enabled: true
    exec.enabled: true
    timeout.reconciliation: 60s
    # Application health: app-of-apps sync waves wait for child apps to be Healthy
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  params:
    server.insecure: true
  secret:
    # bcrypt of DevOps@123456 (htpasswd -nbBC 10 "" 'DevOps@123456')
    argocdServerAdminPassword: "$2a$10$7s8gETZJUNVUsPZzAEsbAOF6x.cTXFUMAQ4mOiYzjINR28Oqx72VO"
    argocdServerAdminPasswordMtime: "2026-01-01T00:00:00Z"

dex:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost.com
  metrics:
    enabled: true
  extensions:
    enabled: true
    extensionList:
      - name: rollout-extension
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar

controller:
  metrics:
    enabled: true

repoServer:
  metrics:
    enabled: true
