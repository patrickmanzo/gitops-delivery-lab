# static seal: auto-unseal with the key from the openbao-unseal Secret (make openbao-unseal-key);
# KMS in production. initialize only runs on an empty volume and exposes no root token.
injector:
  enabled: false
server:
  dataStorage:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  volumes:
    - name: unseal
      secret:
        secretName: openbao-unseal
  volumeMounts:
    - name: unseal
      mountPath: /openbao/unseal
      readOnly: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: openbao.localhost.com
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }

      seal "static" {
        current_key_id = "lab-1"
        current_key = "file:///openbao/unseal/key"
      }

      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = true
      }

      initialize "secrets" {
        request "mount-kv" {
          operation = "update"
          path = "sys/mounts/secret"
          data = {
            type = "kv"
            options = { version = "2" }
          }
        }
      }

      initialize "kubernetes-auth" {
        request "enable" {
          operation = "update"
          path = "sys/auth/kubernetes"
          data = { type = "kubernetes" }
        }
        request "config" {
          operation = "update"
          path = "auth/kubernetes/config"
          data = { kubernetes_host = "https://kubernetes.default.svc" }
        }
      }

      # apps: apps-<namespace> roles in terraform/openbao.tf
      initialize "external-secrets" {
        request "policy-platform" {
          operation = "update"
          path = "sys/policies/acl/eso-platform"
          data = {
            policy = <<-EOP
              path "secret/data/platform/*" { capabilities = ["create", "read", "update"] }
              path "secret/metadata/platform/*" { capabilities = ["create", "read", "update", "list"] }
            EOP
          }
        }
        request "role-platform" {
          operation = "update"
          path = "auth/kubernetes/role/eso-platform"
          data = {
            bound_service_account_names = ["eso-platform"]
            bound_service_account_namespaces = ["external-secrets"]
            policies = ["eso-platform"]
            ttl = "1h"
          }
        }
      }

      # changes after boot: kubectl -n openbao create token openbao-admin -> login role=admin
      initialize "admin" {
        request "policy" {
          operation = "update"
          path = "sys/policies/acl/admin"
          data = {
            policy = <<-EOP
              path "sys/*" { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }
              path "auth/*" { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }
              path "secret/*" { capabilities = ["create", "read", "update", "delete", "list"] }
            EOP
          }
        }
        request "role" {
          operation = "update"
          path = "auth/kubernetes/role/admin"
          data = {
            bound_service_account_names = ["openbao-admin"]
            bound_service_account_namespaces = ["openbao"]
            policies = ["admin"]
            ttl = "15m"
          }
        }
      }
