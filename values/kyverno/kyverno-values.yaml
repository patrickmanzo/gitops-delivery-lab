admissionController:
  replicas: 1
  # own dashboard in monitoring/kyverno.yaml (the chart's does not read CEL policy metrics)
  serviceMonitor:
    enabled: true
  container:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
reportsController:
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
backgroundController:
  enabled: false
cleanupController:
  enabled: false
