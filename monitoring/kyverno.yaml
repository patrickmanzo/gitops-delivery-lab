# Painel do Kyverno: PolicyReports via kube-state-metrics (customResourceState) + métricas do admission controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-kyverno
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kyverno.json: |
    {
      "uid": "kyverno",
      "title": "Kyverno: políticas",
      "tags": [
        "kyverno",
        "policy"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "description": "Políticas CEL (ValidatingPolicy/ImageValidatingPolicy): estado atual pelos PolicyReports (kube-state-metrics) e execução pelas métricas do Kyverno.",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Violações agora",
          "description": "Workloads x políticas falhando nos PolicyReports (estado atual).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kyverno_policyreport_result{result=\"fail\", resource_kind!~\"Pod|ReplicaSet\"}) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Conformidade",
          "description": "Resultados pass / total nos PolicyReports.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kyverno_policyreport_result{result=\"pass\", resource_kind!~\"Pod|ReplicaSet\"}) / count(kyverno_policyreport_result{resource_kind!~\"Pod|ReplicaSet\"})",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Bloqueios (24h)",
          "description": "Requisições negadas na admissão (políticas em Deny).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(kyverno_admission_requests_total{request_allowed=\"false\"}[24h])) or vector(0)",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Políticas ativas",
          "description": "Políticas com resultado nos PolicyReports.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(count by (policy) (kyverno_policyreport_result))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Webhook p95",
          "description": "Latência que o Kyverno adiciona a cada criação/alteração de recurso.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kyverno_admission_review_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Avaliações/s",
          "description": "Execuções de política (admissão + background).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate({__name__=~\"kyverno_(image_)?validating_policy_results_total\"}[$__rate_interval]))",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Violações atuais por política",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (policy) (kyverno_policyreport_result{result=\"fail\", resource_kind!~\"Pod|ReplicaSet\"})",
              "legendFormat": "{{policy}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Violações atuais por ambiente",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace) (kyverno_policyreport_result{result=\"fail\", resource_kind!~\"Pod|ReplicaSet\"})",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Avaliações por resultado",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (result) (rate({__name__=~\"kyverno_(image_)?validating_policy_results_total\"}[$__rate_interval]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Bloqueios na admissão",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 8,
            "h": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (resource_namespace, resource_kind) (increase(kyverno_admission_requests_total{request_allowed=\"false\"}[$__rate_interval]))",
              "legendFormat": "{{resource_namespace}} {{resource_kind}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Tempo de execução p95 por política",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, policy_name) (rate({__name__=~\"kyverno_(image_)?validating_policy_execution_duration_seconds_bucket\"}[$__rate_interval])))",
              "legendFormat": "{{policy_name}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "table",
          "title": "Violações atuais (PolicyReports)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 8
          },
          "description": "kubectl get policyreport -A para a mensagem completa.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kyverno_policyreport_result{result=\"fail\", resource_kind!~\"Pod|ReplicaSet\"}",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true,
                  "result": true,
                  "customresource_group": true,
                  "customresource_kind": true,
                  "customresource_version": true
                },
                "indexByName": {
                  "namespace": 0,
                  "resource_kind": 1,
                  "resource_name": 2,
                  "policy": 3
                },
                "renameByName": {
                  "namespace": "Ambiente",
                  "resource_kind": "Tipo",
                  "resource_name": "Recurso",
                  "policy": "Política"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        }
      ]
    }
