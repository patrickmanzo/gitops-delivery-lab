# Dashboard como código: o sidecar do Grafana carrega ConfigMaps com label grafana_dashboard=1
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-restapi-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  restapi-red.json: |
    {
      "uid": "restapi-red",
      "title": "restapi: RED (traces, métricas e logs)",
      "tags": [
        "restapi",
        "tracing"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "env",
            "label": "Ambiente",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(traces_spanmetrics_calls_total, deployment_environment_name)",
              "refId": "env"
            },
            "refresh": 2,
            "current": {
              "text": "dev",
              "value": "dev"
            }
          },
          {
            "name": "service",
            "label": "Serviço",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(traces_spanmetrics_calls_total{deployment_environment_name=\"$env\"}, service)",
              "refId": "svc"
            },
            "refresh": 2,
            "current": {
              "text": "restapi-flask",
              "value": "restapi-flask"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests/s",
          "description": "Spans de servidor do app (cada request HTTP)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Erros (5xx)",
          "description": "Fração de respostas 5xx",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\", http_response_status_code=~\"5..\"}[$__rate_interval])) / sum(rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])) or vector(0)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latência p95",
          "description": "95% dos requests abaixo deste tempo",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Erros 4xx/s",
          "description": "Requisições recusadas (validação, não encontrado)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\", http_response_status_code=~\"4..\"}[$__rate_interval])) or vector(0)"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests/s por rota",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (span_name) (rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
              "legendFormat": "{{span_name}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Respostas por status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (http_response_status_code) (rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\", http_response_status_code!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{http_response_status_code}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latência (pontos = exemplars, clique abre o trace)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "exemplar": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "exemplar": true
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "exemplar": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "MongoDB: operações/s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (span_name) (rate(traces_spanmetrics_calls_total{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_CLIENT\"}[$__rate_interval]))",
              "legendFormat": "{{span_name}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "MongoDB: latência p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, span_name) (rate(traces_spanmetrics_latency_bucket{service=\"$service\", deployment_environment_name=\"$env\", span_kind=\"SPAN_KIND_CLIENT\"}[$__rate_interval])))",
              "legendFormat": "{{span_name}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "nodeGraph",
          "title": "Service graph",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 10,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "serviceMap"
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Traces recentes (clique no trace ID)",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 10,
            "y": 20,
            "w": 14,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "limit": 20,
              "tableType": "traces",
              "query": "{resource.service.name=\"$service\" && resource.deployment.environment.name=\"$env\" && span:kind=server}"
            }
          ]
        },
        {
          "id": 12,
          "type": "logs",
          "title": "Logs de erro/aviso (trace_id vira link para o Tempo)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 10
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"$env\"} |= \"$service\" | json | level=~\"error|warning|critical\""
            }
          ]
        }
      ]
    }
